zombie_c: {
title: "zombie.c",
badge: "Controle do Heap RAM",
code: `
<span class="c-macro">#include &lt;stdio.h&gt;</span>
<span class="c-macro">#include &lt;stdlib.h&gt;</span>
<span class="c-macro">#include &lt;string.h&gt;</span>
<span class="c-macro">#include "zombie.h"</span>

<span class="c-keyword">void</span> inicializarFila(Fila *f) {
    f->inicio = NULL;
    f->fim = NULL;
}

<span class="c-keyword">int</span> filaVazia(Fila *f) {
    <span class="c-keyword">return</span> f->inicio == NULL;
}

<span class="c-keyword">void</span> enqueueZombie(Fila *f, <span class="c-keyword">char</span> *nome, <span class="c-keyword">int</span> hp, <span class="c-keyword">int</span> dano) {
    Zombie *novo = (Zombie*) malloc(sizeof(Zombie)); 
    <span class="c-keyword">if</span> (novo == NULL) <span class="c-keyword">return</span>;
    
    strcpy(novo->nome, nome); 
    novo->hp = hp; 
    novo->hpMax = hp; 
    novo->dano = dano; 
    novo->prox = NULL;

    <span class="c-keyword">if</span> (filaVazia(f)) { 
        f->inicio = novo;
        f->fim = novo;
    } <span class="c-keyword">else</span> { 
        f->fim->prox = novo;
        f->fim = novo;
    }
}

<span class="c-keyword">void</span> dequeueZombie(Fila *f) {
    <span class="c-keyword">if</span> (filaVazia(f)) <span class="c-keyword">return</span>;

    Zombie *aux = f->inicio;
    f->inicio = f->inicio->prox;

    <span class="c-keyword">if</span> (f->inicio == NULL) 
        f->fim = NULL;

    free(aux);
}
`
},
